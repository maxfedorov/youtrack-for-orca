name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Orca release whose test runtime and manifest validator the plugin is checked with. Bump it deliberately.
  ORCA_REF: v1.4.252

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false

      # `orca plugin test` is plain Node with the files Orca ships for `orca` and `orca/testing`;
      # they are in Orca's repository, so no Orca app is needed.
      - name: Check out Orca's test runtime
        uses: actions/checkout@v4
        with:
          repository: stablyai/orca
          ref: ${{ env.ORCA_REF }}
          path: orca
          sparse-checkout: resources/plugins/declarative
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run the tests
        working-directory: plugin
        env:
          ORCA_PLUGIN_TEST_ROOT: ${{ github.workspace }}/plugin
          REGISTER: ${{ github.workspace }}/orca/resources/plugins/declarative/orca-test-register.mjs
        run: |
          mapfile -t files < <(find test -name '*.test.*' | sort)
          node --enable-source-maps --import "file://$REGISTER" --test "${files[@]}"

  validate:
    name: Validate manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false

      - name: Check out Orca
        uses: actions/checkout@v4
        with:
          repository: stablyai/orca
          ref: ${{ env.ORCA_REF }}
          path: orca
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: orca/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: orca/pnpm-lock.yaml

      # The validator needs only Orca's JavaScript packages, not Electron or native modules.
      - name: Install Orca's validator
        working-directory: orca
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build:packages

      - name: Validate the plugin
        working-directory: orca
        run: pnpm validate:plugin "${{ github.workspace }}/plugin"
